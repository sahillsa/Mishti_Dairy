<ion-content class="auth-content" fullscreen="true">
  <div class="auth-layout auth-layout--compact">
    <section class="auth-visual">
      <img
        src="https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=1200&q=80"
        alt="Dairy drink on a table"
      />
      <div class="auth-brand">
        <ion-icon name="help-circle-outline"></ion-icon>
        <h1>Recover access</h1>
        <p>Demo password recovery flow for the client preview.</p>
      </div>
    </section>

    <section class="auth-panel">
      <ion-card>
        <ion-card-header>
          <ion-card-title>Forgot Password</ion-card-title>
          <ion-card-subtitle>Enter a registered email</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
          <form [formGroup]="form" (ngSubmit)="recover()">
            <ion-list lines="full">
              <ion-item>
                <ion-icon name="mail-outline" slot="start"></ion-icon>
                <ion-input label="Email" labelPlacement="stacked" type="email" formControlName="email"></ion-input>
              </ion-item>
            </ion-list>

            <ion-button expand="block" type="submit">Generate reset link</ion-button>
          </form>

          <ion-note [color]="isSuccess ? 'success' : 'danger'" *ngIf="message">{{ message }}</ion-note>

          <div class="auth-links">
            <ion-button fill="clear" routerLink="/login">Back to login</ion-button>
          </div>
        </ion-card-content>
      </ion-card>
    </section>
  </div>
</ion-content>
