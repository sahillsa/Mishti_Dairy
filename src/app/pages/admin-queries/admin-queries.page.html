<app-page-header title="Admin Queries"></app-page-header>

<ion-content id="main-content" class="page-content" fullscreen="true">
  <ion-grid fixed="true" *ngIf="queries$ | async as queries">
    <ion-row class="section-heading">
      <ion-col>
        <h1>Support queries</h1>
        <p>Open a query to update status and chat with the customer.</p>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12" size-lg="6" *ngFor="let query of queries">
        <ion-card class="query-card" [routerLink]="['/admin/queries', query.id]">
          <ion-card-header>
            <ion-chip [color]="statusColor(query)">{{ query.status }}</ion-chip>
            <ion-card-title>{{ query.subject }}</ion-card-title>
            <ion-card-subtitle>{{ query.date | date: 'medium' }}</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <ion-list lines="none">
              <ion-item>
                <ion-icon name="person-circle-outline" slot="start"></ion-icon>
                <ion-label>
                  <h3>{{ query.name }}</h3>
                  <p>{{ query.email }}</p>
                </ion-label>
              </ion-item>
              <ion-item>
                <ion-icon name="call-outline" slot="start"></ion-icon>
                <ion-label>{{ query.mobile }}</ion-label>
              </ion-item>
              <ion-item>
                <ion-icon name="chatbubble-ellipses-outline" slot="start"></ion-icon>
                <ion-label>{{ query.messages.length }} message(s)</ion-label>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>

<app-bottom-nav></app-bottom-nav>
