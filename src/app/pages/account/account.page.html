<app-page-header title="My Account"></app-page-header>

<ion-content id="main-content" class="page-content" fullscreen="true">
  <ion-grid fixed="true" *ngIf="user$ | async as user">
    <ion-row class="section-heading">
      <ion-col>
        <h1>Account</h1>
        <p>Profile, delivery address, and role-specific actions.</p>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12" size-lg="5">
        <ion-card>
          <ion-card-header class="ion-no-padding">
            <ion-item lines="none" style="--background: transparent; margin-top: 10px;">
              <ion-avatar slot="start" class="profile-avatar">
                <ion-icon name="person-circle-outline"></ion-icon>
              </ion-avatar>
              <ion-label>
                <h2>{{ user.name }}</h2>
                <p>{{ user.role | titlecase }}</p>
              </ion-label>
              <ion-button slot="end" fill="clear" (click)="editName(user)">
                <ion-icon name="create-outline" slot="icon-only"></ion-icon>
              </ion-button>
            </ion-item>
          </ion-card-header>
          <ion-card-content>
            <ion-list lines="none">
              <ion-item>
                <ion-icon name="mail-outline" slot="start"></ion-icon>
                <ion-label>{{ user.email }}</ion-label>
              </ion-item>
              <ion-item>
                <ion-icon name="call-outline" slot="start"></ion-icon>
                <ion-label>{{ user.mobile }}</ion-label>
              </ion-item>
            </ion-list>
            <ion-button expand="block" color="danger" fill="outline" (click)="logout()">Logout</ion-button>
          </ion-card-content>
        </ion-card>

        <ion-card>
          <ion-card-header style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 0;">
            <ion-card-title>Saved Addresses</ion-card-title>
            <ion-button fill="clear" (click)="addAddress(user)">Add</ion-button>
          </ion-card-header>
          <ion-card-content>
            <ng-container *ngIf="getAddresses(user) as addresses">
              <ion-list lines="full" *ngIf="addresses.length > 0; else noAddresses">
                <ion-item *ngFor="let addr of addresses; let i = index">
                  <ion-label class="ion-text-wrap">{{ addr }}</ion-label>
                  <ion-button slot="end" fill="clear" (click)="editAddress(user, i)">
                    <ion-icon name="pencil-outline" slot="icon-only"></ion-icon>
                  </ion-button>
                  <ion-button slot="end" fill="clear" color="danger" (click)="deleteAddress(user, i)">
                    <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
                  </ion-button>
                </ion-item>
              </ion-list>
              <ng-template #noAddresses>
                <p>No addresses saved.</p>
              </ng-template>
            </ng-container>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-lg="7">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Quick actions</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-list lines="full">
              <ion-item button routerLink="/orders">
                <ion-icon name="receipt-outline" slot="start"></ion-icon>
                <ion-label>Orders</ion-label>
              </ion-item>
              <ion-item button routerLink="/help">
                <ion-icon name="help-circle-outline" slot="start"></ion-icon>
                <ion-label>Help & contact</ion-label>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>

<app-bottom-nav></app-bottom-nav>
