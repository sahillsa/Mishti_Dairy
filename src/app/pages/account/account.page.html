<app-page-header title="My Account"></app-page-header>

<ion-content id="main-content" class="page-content" fullscreen="true">
  <ion-grid fixed="true" *ngIf="user$ | async as user">
    <ion-row class="section-heading">
      <ion-col>
        <h1>Account</h1>
        <p>Profile, delivery address, and role-specific actions.</p>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12" size-lg="5">
        <ion-card>
          <ion-card-header>
            <ion-avatar class="profile-avatar">
              <ion-icon name="person-circle-outline"></ion-icon>
            </ion-avatar>
            <ion-card-title>{{ user.name }}</ion-card-title>
            <ion-card-subtitle>{{ user.role | titlecase }}</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <ion-list lines="none">
              <ion-item>
                <ion-icon name="mail-outline" slot="start"></ion-icon>
                <ion-label>{{ user.email }}</ion-label>
              </ion-item>
              <ion-item>
                <ion-icon name="call-outline" slot="start"></ion-icon>
                <ion-label>{{ user.mobile }}</ion-label>
              </ion-item>
              <ion-item>
                <ion-icon name="location-outline" slot="start"></ion-icon>
                <ion-label>{{ user.address }}</ion-label>
              </ion-item>
            </ion-list>
            <ion-button expand="block" color="danger" fill="outline" (click)="logout()">Logout</ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-lg="7">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Quick actions</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-list lines="full">
              <ion-item button routerLink="/orders">
                <ion-icon name="receipt-outline" slot="start"></ion-icon>
                <ion-label>Orders</ion-label>
              </ion-item>
              <ion-item button routerLink="/help">
                <ion-icon name="help-circle-outline" slot="start"></ion-icon>
                <ion-label>Help & contact</ion-label>
              </ion-item>
              <ion-item button routerLink="/admin" *ngIf="user.role === 'admin'">
                <ion-icon name="speedometer-outline" slot="start"></ion-icon>
                <ion-label>Admin dashboard</ion-label>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>

<app-bottom-nav></app-bottom-nav>
