<ion-header class="app-header">
  <ion-toolbar>
    <ion-buttons slot="start" *ngIf="user$ | async as user">
      <ion-button [routerLink]="homeLink(user)" aria-label="Mishti Farmer home" class="logo-btn">
        <img src="assets/logo.png" alt="Mishti Logo" class="header-logo" />
      </ion-button>
    </ion-buttons>

    <ion-title>{{ title }}</ion-title>

    <ion-buttons slot="end" *ngIf="user$ | async as user">
      <ng-container *ngIf="user.role === 'admin'; else userLinks">
        <ion-button class="desktop-link" routerLink="/admin/dashboard">Dashboard</ion-button>
        <ion-button class="desktop-link" routerLink="/admin/orders">Orders</ion-button>
        <ion-button class="desktop-link" routerLink="/admin/products">Inventory</ion-button>
        <ion-button class="desktop-link" routerLink="/admin/queries">Queries</ion-button>
        <ion-button class="desktop-link" routerLink="/admin/control">Control</ion-button>
      </ng-container>

      <ng-template #userLinks>
        <ion-button class="desktop-link" routerLink="/home">Home</ion-button>
        <ion-button class="desktop-link" routerLink="/products">Products</ion-button>
        <ion-button class="desktop-link" routerLink="/orders">Orders</ion-button>
        <ion-button class="desktop-link" routerLink="/help">Help</ion-button>

        <ion-button class="desktop-link" routerLink="/cart" aria-label="Cart">
          <ion-icon slot="icon-only" name="bag-outline"></ion-icon>
          <ion-badge *ngIf="cartCount$ | async as count" color="danger">{{ count }}</ion-badge>
        </ion-button>

        <ion-button class="desktop-link" routerLink="/account" aria-label="My account">
          <ion-icon slot="icon-only" name="person-circle-outline"></ion-icon>
        </ion-button>
      </ng-template>

      <ion-button aria-label="Logout" (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
