<ion-header class="app-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/home" aria-label="Mishti Farmer home">
        <ion-icon slot="icon-only" name="storefront-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>{{ title }}</ion-title>

    <ion-buttons slot="end" *ngIf="user$ | async as user">
      <ion-button class="desktop-link" routerLink="/home">Home</ion-button>
      <ion-button class="desktop-link" routerLink="/products">Products</ion-button>
      <ion-button class="desktop-link" routerLink="/orders">Orders</ion-button>
      <ion-button class="desktop-link" routerLink="/help">Help</ion-button>
      <ion-button class="desktop-link" *ngIf="user.role === 'admin'" routerLink="/admin">
        Admin
      </ion-button>

      <ion-button routerLink="/cart" aria-label="Cart">
        <ion-icon slot="icon-only" name="bag-outline"></ion-icon>
        <ion-badge *ngIf="cartCount$ | async as count" color="danger">{{ count }}</ion-badge>
      </ion-button>

      <ion-button routerLink="/account" aria-label="My account">
        <ion-icon slot="icon-only" name="person-circle-outline"></ion-icon>
      </ion-button>

      <ion-button aria-label="Logout" (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
